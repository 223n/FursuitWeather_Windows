# GitHub Release の本文を自動で作るときの分類。ラベルで振り分ける。
# 「リリースを公開する」ワークフローが gh release create --generate-notes で使う。
# 参考: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# PR は上から順に、最初に当たった分類へ入る。1つの PR が2つの分類に載ることはない。
# そのため、種類のラベル（機能追加・バグ）を、パスから付く「ドキュメント」より上に置いてある。
#
# 種類のラベルは PR の表題の接頭辞から付く。対応は .github/workflows/labeler.yml にある。
#
#   [Add] → 機能追加 / [Fix] → バグ / [Doc] → ドキュメント / [Mod] と [Del] → その他の変更
#
# 破壊的変更とセキュリティは自動で付かない。PR を確認した人が付ける。
changelog:
  exclude:
    labels:
      # リリースの PR そのものと、戻しの PR は変更ではない
      - リリース
      - 重複
      - 無効
      - 対応しない
    # リリースのワークフローが開く PR の作者。New Contributors に載らないようにする
    authors:
      - github-actions[bot]
  categories:
    - title: 破壊的変更
      labels:
        - 破壊的変更
    - title: セキュリティ
      labels:
        - セキュリティ
    - title: 新しい機能
      labels:
        - 機能追加
    - title: 不具合の修正
      labels:
        - バグ
    - title: 文書
      labels:
        - ドキュメント
    - title: 依存関係の更新
      labels:
        - 依存関係
    - title: その他の変更
      labels:
        - '*'
